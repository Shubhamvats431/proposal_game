<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Niku Friendship Game</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    background:linear-gradient(135deg,#ffb6d9,#ffdce9);
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    width:90%;
    max-width:550px;
    background:white;
    padding:40px 25px;
    border-radius:25px;
    text-align:center;
    box-shadow:0 15px 40px rgba(0,0,0,0.2);
    position:relative;
}

h1{
    color:#ff2d75;
    margin-bottom:10px;
    font-size:38px;
}

.question{
    font-size:22px;
    color:#555;
    margin-bottom:35px;
}

.options{
    display:flex;
    justify-content:space-around;
    margin-top:20px;
}

.box{
    width:160px;
    height:160px;
    border-radius:25px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:35px;
    font-weight:bold;
    transition:0.3s;
    position:relative;
}

#yes{
    background:#d7ffd9;
    border:4px solid #32c24d;
    color:#1d8f35;
}

#no{
    background:#ffe1e1;
    border:4px solid #ff4d4d;
    color:#d90000;
    position:relative;
}

.heart{
    width:90px;
    height:90px;
    background:#ff2d75;
    position:absolute;
    bottom:40px;
    left:50%;
    transform:translateX(-50%) rotate(-45deg);
    cursor:grab;
    z-index:999;
}

.heart::before,
.heart::after{
    content:"";
    width:90px;
    height:90px;
    background:#ff2d75;
    border-radius:50%;
    position:absolute;
}

.heart::before{
    top:-45px;
    left:0;
}

.heart::after{
    left:45px;
    top:0;
}

.message{
    margin-top:30px;
    font-size:28px;
    color:#ff2d75;
    display:none;
    animation:pop 0.5s ease;
}

@keyframes pop{
    from{
        transform:scale(0);
        opacity:0;
    }
    to{
        transform:scale(1);
        opacity:1;
    }
}

.float{
    position:absolute;
    font-size:28px;
    animation:floatUp 3s linear forwards;
}

@keyframes floatUp{
    0%{
        transform:translateY(0);
        opacity:1;
    }
    100%{
        transform:translateY(-250px);
        opacity:0;
    }
}

</style>
</head>
<body>

<div class="container">

    <h1>Niku 💖</h1>

    <div class="question">
        Would you be my friend?
    </div>

    <div class="options">
        <div class="box" id="yes">YES 😍</div>
        <div class="box" id="no">NO 😝</div>
    </div>

    <div class="heart" id="heart"></div>

    <div class="message" id="message">
        Awwww 💕<br>
        You just made my day, Niku 🥹💖
    </div>

</div>

<script>

const heart = document.getElementById("heart");
const yesBox = document.getElementById("yes");
const noBox = document.getElementById("no");
const message = document.getElementById("message");

let dragging = false;
let offsetX = 0;
let offsetY = 0;

// Mouse Events
heart.addEventListener("mousedown", startDrag);
document.addEventListener("mousemove", drag);
document.addEventListener("mouseup", stopDrag);

// Touch Events
heart.addEventListener("touchstart", startTouchDrag);
document.addEventListener("touchmove", touchDrag);
document.addEventListener("touchend", stopDrag);

function startDrag(e){
    dragging = true;

    const rect = heart.getBoundingClientRect();

    offsetX = e.clientX - rect.left;
    offsetY = e.clientY - rect.top;
}

function drag(e){

    if(!dragging) return;

    moveHeart(e.clientX,e.clientY);

    detectNoBox(e.clientX,e.clientY);
}

function startTouchDrag(e){

    dragging = true;

    const touch = e.touches[0];
    const rect = heart.getBoundingClientRect();

    offsetX = touch.clientX - rect.left;
    offsetY = touch.clientY - rect.top;
}

function touchDrag(e){

    if(!dragging) return;

    const touch = e.touches[0];

    moveHeart(touch.clientX,touch.clientY);

    detectNoBox(touch.clientX,touch.clientY);
}

function moveHeart(x,y){

    heart.style.left = (x - offsetX) + "px";
    heart.style.top = (y - offsetY) + "px";
    heart.style.bottom = "auto";
    heart.style.transform = "rotate(-45deg)";
}

function detectNoBox(x,y){

    const noRect = noBox.getBoundingClientRect();

    if(
        x > noRect.left - 40 &&
        x < noRect.right + 40 &&
        y > noRect.top - 40 &&
        y < noRect.bottom + 40
    ){

        // NO runs away
        const randomX = Math.random() * (window.innerWidth - 180);
        const randomY = Math.random() * (window.innerHeight - 180);

        noBox.style.position = "fixed";
        noBox.style.left = randomX + "px";
        noBox.style.top = randomY + "px";
    }
}

function stopDrag(){

    if(!dragging) return;

    dragging = false;

    const heartRect = heart.getBoundingClientRect();
    const yesRect = yesBox.getBoundingClientRect();

    if(
        heartRect.left < yesRect.right &&
        heartRect.right > yesRect.left &&
        heartRect.top < yesRect.bottom &&
        heartRect.bottom > yesRect.top
    ){
        success();
    }
}

function success(){

    heart.style.display = "none";

    message.style.display = "block";

    for(let i=0;i<25;i++){
        createFloatingHeart();
    }
}

function createFloatingHeart(){

    const item = document.createElement("div");

    item.classList.add("float");

    const emojis = ["💖","💕","✨","🌸","😍"];

    item.innerHTML = emojis[Math.floor(Math.random()*emojis.length)];

    item.style.left = Math.random()*window.innerWidth + "px";
    item.style.top = window.innerHeight + "px";

    document.body.appendChild(item);

    setTimeout(()=>{
        item.remove();
    },3000);
}

</script>

</body>
</html>
