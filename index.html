<!DOCTYPE html>
<html>
<head>
    <title>Important Question Dolly 😌</title>

    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            margin-top: 50px;
            overflow: hidden;
        }

        h1 { margin-bottom: 10px; }

        .options {
            display: flex;
            justify-content: center;
            gap: 80px;
            margin-top: 80px;
        }

        .box {
            width: 150px;
            height: 100px;
            border: 3px solid black;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            position: relative;
        }

        #heart {
            font-size: 40px;
            position: absolute;
            top: 200px;
            left: 50%;
            transform: translateX(-50%);
            cursor: grab;
        }
    </style>
</head>

<body>

<h1>Hello Dolly 😄</h1>
<h2>Drag the heart to choose 😌</h2>

<div class="options">
    <div class="box" id="acceptBox">Accept ❤️</div>
    <div class="box" id="rejectBox">Reject 😢</div>
</div>

<div id="heart">❤️</div>

<script>
const heart = document.getElementById("heart");
const rejectBox = document.getElementById("rejectBox");
const acceptBox = document.getElementById("acceptBox");

let offsetX, offsetY;

heart.addEventListener("touchstart", startDrag);
heart.addEventListener("touchmove", drag);
heart.addEventListener("mousedown", startDrag);
document.addEventListener("mousemove", drag);
document.addEventListener("mouseup", drop);

function startDrag(e) {
    const touch = e.touches ? e.touches[0] : e;
    offsetX = touch.clientX - heart.offsetLeft;
    offsetY = touch.clientY - heart.offsetTop;
}

function drag(e) {
    if (offsetX == null) return;

    const touch = e.touches ? e.touches[0] : e;
    heart.style.left = touch.clientX - offsetX + "px";
    heart.style.top = touch.clientY - offsetY + "px";

    checkRejectProximity();
}

function drop() {
    if (isOverlapping(heart, acceptBox)) {
        alert("Yayyy! You just made my day 😎❤️");
    }

    offsetX = null;
}

function isOverlapping(a, b) {
    const rect1 = a.getBoundingClientRect();
    const rect2 = b.getBoundingClientRect();

    return !(
        rect1.right < rect2.left ||
        rect1.left > rect2.right ||
        rect1.bottom < rect2.top ||
        rect1.top > rect2.bottom
    );
}

function checkRejectProximity() {
    if (isOverlapping(heart, rejectBox)) {
        const x = Math.random() * (window.innerWidth - 200);
        const y = Math.random() * (window.innerHeight - 200);

        rejectBox.style.position = "absolute";
        rejectBox.style.left = x + "px";
        rejectBox.style.top = y + "px";
    }
}
</script>

</body>
</html>
