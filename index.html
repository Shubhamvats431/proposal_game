<!DOCTYPE html>
<html>
<head>
    <title>Important Question Dolly 😌</title>
    <style>
        body {
            text-align: center;
            margin-top: 100px;
            font-family: Arial, sans-serif;
        }

        #reject {
            position: absolute;
        }

        button {
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<h1>Will you be my partner in shararati tatav partnership firm? 😄</h1>

<button onclick="accept()">Accept ❤️</button>
<button id="reject" onmouseover="moveButton()">Reject 😢</button>

<script>
function accept() {
    alert("Yayyy! You just made my day 😎❤️");
}

function moveButton() {
    var button = document.getElementById("reject");

    var x = Math.random() * (window.innerWidth - 100);
    var y = Math.random() * (window.innerHeight - 50);

    button.style.left = x + "px";
    button.style.top = y + "px";
}
</script>

</body>
</html>
