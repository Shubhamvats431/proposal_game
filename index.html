<!DOCTYPE html>
<html>
<head>
    <title>Important Question Dolly 😌</title>

    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            margin-top: 50px;
            overflow: hidden;
        }

        h1 { margin-bottom: 10px; }

        .options {
            display: flex;
            justify-content: center;
            gap: 80px;
            margin-top: 80px;
        }

        .box {
            width: 150px;
            height: 100px;
            border: 3px solid black;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            position: relative;
        }

        #heart {
            font-size: 40px;
            position: absolute;
            top: 200px;
            left: 50%;
            transform: translateX(-50%);
            cursor: grab;
            user-select: none;
        }
    </style>
</head>

<body>

<h1>Hello Dolly 😄</h1>
<h2>Will you be my partner in shararati tatav partnership firm? 😄</h2>
<h3>Drag the heart to the selected option and then click on that box 😌</h3>

<div class="options">
    <div class="box" id="acceptBox">Accept ❤️</div>
    <div class="box" id="rejectBox">Reject 😢</div>
</div>

<div id="heart">❤️</div>

<script>
const heart = document.getElementById("heart");
const rejectBox = document.getElementById("rejectBox");
const acceptBox = document.getElementById("acceptBox");

let offsetX, offsetY;
let dragging = false;

// Start drag
heart.addEventListener("mousedown", startDrag);
heart.addEventListener("touchstart", startDrag, {passive:false});

// Dragging
document.addEventListener("mousemove", drag);
document.addEventListener("touchmove", drag, {passive:false});

// Drop
document.addEventListener("mouseup", endDrag);
document.addEventListener("touchend", endDrag);

function startDrag(e) {
    e.preventDefault();
    dragging = true;
    const touch = e.touches ? e.touches[0] : e;
    offsetX = touch.clientX - heart.offsetLeft;
    offsetY = touch.clientY - heart.offsetTop;
}

function drag(e) {
    if (!dragging) return;

    e.preventDefault();
    const touch = e.touches ? e.touches[0] : e;
    let x = touch.clientX - offsetX;
    let y = touch.clientY - offsetY;

    // Keep heart inside window
    x = Math.max(0, Math.min(window.innerWidth - heart.offsetWidth, x));
    y = Math.max(0, Math.min(window.innerHeight - heart.offsetHeight, y));

    heart.style.left = x + "px";
    heart.style.top = y + "px";

    // Check if near reject box
    if (isOverlapping(heart, rejectBox)) {
        const rx = Math.random() * (window.innerWidth - rejectBox.offsetWidth);
        const ry = Math.random() * (window.innerHeight - rejectBox.offsetHeight);
        rejectBox.style.position = "absolute";
        rejectBox.style.left = rx + "px";
        rejectBox.style.top = ry + "px";
    }
}

function endDrag(e) {
    if (!dragging) return;
    dragging = false;

    if (isOverlapping(heart, acceptBox)) {
        alert("Yayyy! You just made my day 😎❤️");
        // Reset heart
        heart.style.left = "50%";
        heart.style.top = "200px";
    }
}

function isOverlapping(a, b) {
    const rect1 = a.getBoundingClientRect();
    const rect2 = b.getBoundingClientRect();

    return !(
        rect1.right < rect2.left ||
        rect1.left > rect2.right ||
        rect1.bottom < rect2.top ||
        rect1.top > rect2.bottom
    );
}
</script>

</body>
</html>
