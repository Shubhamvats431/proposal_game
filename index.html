<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Niku Friendship Game</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color: transparent;
    font-family:Arial, sans-serif;
}

body{
    width:100%;
    height:100vh;
    overflow:hidden;
    background:linear-gradient(135deg,#ffb6d9,#ffdce9);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:10px;
}

.container{
    width:100%;
    max-width:900px;
    height:100%;
    max-height:780px;
    background:white;
    border-radius:25px;
    position:relative;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,0.15);
    padding-top:25px;
}

h1{
    text-align:center;
    color:#ff2d75;
    font-size:40px;
}

.question{
    text-align:center;
    margin-top:10px;
    font-size:22px;
    color:#555;
    padding:0 20px;
}

.game-area{
    position:relative;
    width:100%;
    height:calc(100% - 150px);
}

/* YES BOX */
.box{
    width:120px;
    height:120px;
    border-radius:25px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:26px;
    font-weight:bold;
    position:absolute;
    user-select:none;
    transition:0.25s ease;
}

/* YES */
#yes{
    left:20px;
    top:80px;
    background:#d7ffd9;
    border:4px solid #2db44b;
    color:#178533;
}

/* NO */
#no{
    right:20px;
    top:80px;
    background:#ffe2e2;
    border:4px solid #ff4a4a;
    color:#d70000;
}

/* HEART */
.heart{
    width:65px;
    height:65px;
    background:#ff2d75;
    position:absolute;
    left:50%;
    bottom:70px;
    transform:translateX(-50%) rotate(-45deg);
    border-radius:8px;
    cursor:grab;
    z-index:1000;
    touch-action:none;
    transition:left 0.03s linear, top 0.03s linear;
}

.heart::before,
.heart::after{
    content:"";
    width:65px;
    height:65px;
    background:#ff2d75;
    border-radius:50%;
    position:absolute;
}

.heart::before{
    top:-32px;
    left:0;
}

.heart::after{
    left:32px;
    top:0;
}

/* SUCCESS */
.message{
    position:absolute;
    bottom:20px;
    width:100%;
    text-align:center;
    font-size:28px;
    color:#ff2d75;
    display:none;
    animation:pop 0.5s ease;
    padding:0 20px;
}

@keyframes pop{
    from{
        transform:scale(0);
        opacity:0;
    }
    to{
        transform:scale(1);
        opacity:1;
    }
}

.float{
    position:absolute;
    font-size:28px;
    animation:floatUp 3s linear forwards;
    pointer-events:none;
}

@keyframes floatUp{
    0%{
        transform:translateY(0);
        opacity:1;
    }
    100%{
        transform:translateY(-250px);
        opacity:0;
    }
}

/* MOBILE RESPONSIVE */
@media(max-width:600px){

    h1{
        font-size:34px;
    }

    .question{
        font-size:19px;
    }

    .box{
        width:95px;
        height:95px;
        font-size:20px;
    }

    #yes{
        left:15px;
        top:100px;
    }

    #no{
        right:15px;
        top:100px;
    }

    .heart{
        width:55px;
        height:55px;
        bottom:90px;
    }

    .heart::before,
    .heart::after{
        width:55px;
        height:55px;
    }

    .heart::before{
        top:-27px;
    }

    .heart::after{
        left:27px;
    }

    .message{
        font-size:24px;
    }
}

</style>
</head>
<body>

<div class="container">

    <h1>Niku 💖</h1>

    <div class="question">
        Would you be my friend?
    </div>

    <div class="game-area" id="gameArea">

        <div class="box" id="yes">
            YES 😍
        </div>

        <div class="box" id="no">
            NO 😝
        </div>

        <div class="heart" id="heart"></div>

    </div>

    <div class="message" id="message">
        Awwww 💕<br>
        You just made my day Niku 🥹💖
    </div>

</div>

<script>

const heart = document.getElementById("heart");
const yesBox = document.getElementById("yes");
const noBox = document.getElementById("no");
const message = document.getElementById("message");

let dragging = false;
let shiftX = 0;
let shiftY = 0;

// START DRAG
function startDrag(clientX, clientY){

    dragging = true;

    const rect = heart.getBoundingClientRect();

    shiftX = clientX - rect.left;
    shiftY = clientY - rect.top;

    heart.style.transition = "none";
}

// MOVE HEART
function moveHeart(clientX, clientY){

    if(!dragging) return;

    const x = clientX - shiftX;
    const y = clientY - shiftY;

    heart.style.left = x + "px";
    heart.style.top = y + "px";
    heart.style.bottom = "auto";
    heart.style.transform = "rotate(-45deg)";

    checkNoEscape(clientX, clientY);
}

// STOP DRAG
function stopDrag(){

    dragging = false;

    heart.style.transition = "left 0.03s linear, top 0.03s linear";

    checkYesDrop();
}

// CHECK NO ESCAPE
function checkNoEscape(x,y){

    const noRect = noBox.getBoundingClientRect();

    if(
        x > noRect.left - 50 &&
        x < noRect.right + 50 &&
        y > noRect.top - 50 &&
        y < noRect.bottom + 50
    ){

        const area = document.getElementById("gameArea");

        const maxX = area.clientWidth - noBox.offsetWidth - 20;
        const maxY = area.clientHeight - noBox.offsetHeight - 20;

        const randomX = Math.random() * maxX;
        const randomY = Math.random() * maxY;

        noBox.style.left = randomX + "px";
        noBox.style.top = randomY + "px";
        noBox.style.right = "auto";
    }
}

// CHECK YES
function checkYesDrop(){

    const heartRect = heart.getBoundingClientRect();
    const yesRect = yesBox.getBoundingClientRect();

    if(
        heartRect.left < yesRect.right &&
        heartRect.right > yesRect.left &&
        heartRect.top < yesRect.bottom &&
        heartRect.bottom > yesRect.top
    ){
        showSuccess();
    }
}

// SUCCESS
function showSuccess(){

    heart.style.display = "none";

    message.style.display = "block";

    for(let i=0;i<30;i++){
        createEmoji();
    }
}

// FLOATING EMOJIS
function createEmoji(){

    const emoji = document.createElement("div");

    emoji.classList.add("float");

    const arr = ["💖","💕","✨","😍","🌸"];

    emoji.innerHTML = arr[Math.floor(Math.random()*arr.length)];

    emoji.style.left = Math.random()*window.innerWidth + "px";
    emoji.style.top = window.innerHeight + "px";

    document.body.appendChild(emoji);

    setTimeout(()=>{
        emoji.remove();
    },3000);
}

/* MOUSE EVENTS */

heart.addEventListener("mousedown",(e)=>{
    startDrag(e.clientX,e.clientY);
});

document.addEventListener("mousemove",(e)=>{
    moveHeart(e.clientX,e.clientY);
});

document.addEventListener("mouseup",()=>{
    stopDrag();
});

/* TOUCH EVENTS */

heart.addEventListener("touchstart",(e)=>{

    const touch = e.touches[0];

    startDrag(touch.clientX,touch.clientY);

},{passive:false});

document.addEventListener("touchmove",(e)=>{

    if(!dragging) return;

    const touch = e.touches[0];

    moveHeart(touch.clientX,touch.clientY);

},{passive:false});

document.addEventListener("touchend",()=>{
    stopDrag();
});

</script>

</body>
</html>
