<!DOCTYPE html>
<html>
<head>
    <title>Important Question Dolly 😌</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            overflow: hidden;
            text-align: center;
        }

        .card {
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(15px);
            padding: 40px 60px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }

        h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        h2 {
            font-size: 22px;
            margin-bottom: 20px;
        }

        h3 {
            font-size: 16px;
            margin-bottom: 40px;
            opacity: 0.8;
        }

        .options {
            display: flex;
            justify-content: center;
            gap: 100px;
            position: relative;
        }

        .box {
            width: 220px;
            height: 140px;
            border-radius: 20px;
            font-size: 26px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s ease;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        #acceptBox {
            background: #28a745;
            color: white;
        }

        #rejectBox {
            background: #dc3545;
            color: white;
            position: relative;
        }

        .box:hover {
            transform: scale(1.1);
        }

        #heart {
            font-size: 60px;
            position: absolute;
            top: 70%;
            left: 50%;
            transform: translate(-50%, -50%);
            cursor: grab;
            user-select: none;
            transition: transform 0.2s;
        }

        #heart:active {
            transform: scale(1.2);
        }
    </style>
</head>

<body>

<div class="card">
    <h1>Hello Dolly 😄</h1>
    <h2>Will you be my partner in shararati tatav partnership firm? 😄</h2>
    <h3>Drag the heart to choose 😌</h3>

    <div class="options">
        <div class="box" id="acceptBox">ACCEPT ❤️</div>
        <div class="box" id="rejectBox">REJECT 😢</div>
    </div>
</div>

<div id="heart">❤️</div>

<script>
const heart = document.getElementById("heart");
const rejectBox = document.getElementById("rejectBox");
const acceptBox = document.getElementById("acceptBox");

let offsetX, offsetY;
let dragging = false;

heart.addEventListener("mousedown", startDrag);
heart.addEventListener("touchstart", startDrag, {passive:false});

document.addEventListener("mousemove", drag);
document.addEventListener("touchmove", drag, {passive:false});

document.addEventListener("mouseup", endDrag);
document.addEventListener("touchend", endDrag);

function startDrag(e) {
    e.preventDefault();
    dragging = true;
    const touch = e.touches ? e.touches[0] : e;
    offsetX = touch.clientX - heart.offsetLeft;
    offsetY = touch.clientY - heart.offsetTop;
}

function drag(e) {
    if (!dragging) return;

    e.preventDefault();
    const touch = e.touches ? e.touches[0] : e;

    let x = touch.clientX - offsetX;
    let y = touch.clientY - offsetY;

    x = Math.max(0, Math.min(window.innerWidth - heart.offsetWidth, x));
    y = Math.max(0, Math.min(window.innerHeight - heart.offsetHeight, y));

    heart.style.left = x + "px";
    heart.style.top = y + "px";

    if (isOverlapping(heart, rejectBox)) {
        const rx = Math.random() * (window.innerWidth - rejectBox.offsetWidth);
        const ry = Math.random() * (window.innerHeight - rejectBox.offsetHeight);
        rejectBox.style.position = "absolute";
        rejectBox.style.left = rx + "px";
        rejectBox.style.top = ry + "px";
    }
}

function endDrag() {
    if (!dragging) return;
    dragging = false;

    if (isOverlapping(heart, acceptBox)) {
        alert("Yayyy! You just made my day 😎❤️");
        heart.style.left = "50%";
        heart.style.top = "70%";
    }
}

function isOverlapping(a, b) {
    const rect1 = a.getBoundingClientRect();
    const rect2 = b.getBoundingClientRect();

    return !(
        rect1.right < rect2.left ||
        rect1.left > rect2.right ||
        rect1.bottom < rect2.top ||
        rect1.top > rect2.bottom
    );
}
</script>

</body>
</html>
