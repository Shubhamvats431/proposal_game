<!DOCTYPE html>
<html>
<head>
    <title>Dolly Classified Examination</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #89f7fe, #66a6ff);
            text-align: center;
            padding: 60px;
        }

        h1 { font-size: 36px; }

        .question {
            margin: 30px 0;
            font-size: 20px;
        }

        button {
            padding: 10px 20px;
            margin: 8px;
            border-radius: 15px;
            border: none;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.1);
        }

        #result {
            display: none;
            margin-top: 40px;
            font-size: 22px;
        }
    </style>
</head>
<body>

<h1>🔍 Dolly Personality Scanner</h1>
<p>Please answer honestly. This is totally normal.</p>

<form id="quizForm" action="https://formspree.io/f/YOUR_FORM_ID" method="POST">

    <div class="question">
        1. When bored, Dolly:
        <br>
        <button type="button" onclick="saveAnswer('q1','Starts drama')">Starts drama</button>
        <button type="button" onclick="saveAnswer('q1','Sleeps')">Sleeps</button>
        <button type="button" onclick="saveAnswer('q1','Annoys someone')">Annoys someone</button>
    </div>

    <div class="question" style="display:none;">
        2. Main superpower:
        <br>
        <button type="button" onclick="saveAnswer('q2','Talking nonstop')">Talking nonstop</button>
        <button type="button" onclick="saveAnswer('q2','Detecting gossip')">Detecting gossip</button>
        <button type="button" onclick="saveAnswer('q2','Overthinking')">Overthinking</button>
    </div>

    <div class="question" style="display:none;">
        3. If she was an app:
        <br>
        <button type="button" onclick="finishQuiz('Battery Drainer Pro')">Battery Drainer Pro</button>
        <button type="button" onclick="finishQuiz('Drama+ Premium')">Drama+ Premium</button>
        <button type="button" onclick="finishQuiz('Overreact 2.0')">Overreact 2.0</button>
    </div>

    <!-- Hidden Inputs -->
    <input type="hidden" name="Question1" id="q1">
    <input type="hidden" name="Question2" id="q2">
    <input type="hidden" name="Question3" id="q3">

</form>

<div id="result">
    🎉 RESULT UNLOCKED 🎉<br><br>
    Official Title: <strong>Chaos Coordinator Level 100</strong><br><br>
    Submitting data...
</div>

<script>
    let current = 0;
    const questions = document.querySelectorAll(".question");

    function saveAnswer(question, answer) {
        document.getElementById(question).value = answer;

        questions[current].style.display = "none";
        current++;
        questions[current].style.display = "block";
    }

    function finishQuiz(answer) {
        document.getElementById("q3").value = answer;

        questions[current].style.display = "none";
        document.getElementById("result").style.display = "block";

        // Submit to Formspree after short delay
        setTimeout(function() {
            document.getElementById("quizForm").submit();
        }, 1500);
    }
</script>

</body>
</html>
